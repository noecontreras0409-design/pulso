<style>
/* Layout: columna única tipo app, mucho aire, superficies sin bordes, una sola tinta de acento */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --sunk:#ECECE7; --ink:#16171A; --muted:#75767C; --faint:#B9BAB6;
  --accent:#3B4FE4; --accent-soft:#E9EBFC; --good:#1E9E68; --good-soft:#E4F4EC; --bad:#D4485D; --bad-soft:#FBEAED; --warm:#E07A35;
  --ui:"Figtree",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --surface:#18191C; --sunk:#222327; --ink:#EDEDEA; --muted:#8E8F95; --faint:#4A4B50;
  --accent:#8794FF; --accent-soft:#1F2340; --good:#4CCB92; --good-soft:#132A20; --bad:#F27A8C; --bad-soft:#2E1619; --warm:#F29A5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1012; --surface:#18191C; --sunk:#222327; --ink:#EDEDEA; --muted:#8E8F95; --faint:#4A4B50;
  --accent:#8794FF; --accent-soft:#1F2340; --good:#4CCB92; --good-soft:#132A20; --bad:#F27A8C; --bad-soft:#2E1619; --warm:#F29A5E; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15.5px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:500px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:18px 12px}
.brand{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.hdr-r{display:flex;gap:10px;align-items:center}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;color:var(--warm);font-variant-numeric:tabular-nums}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--spring)}
.icon-btn:active{transform:scale(.9) rotate(30deg)}
h1{font-family:var(--display);font-weight:500;font-size:32px;letter-spacing:-.025em;line-height:1.1;margin:10px 0 22px;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:var(--muted)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.sec{margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:22px;padding:20px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* entrada escalonada */
.anim>*{animation:rise .6s var(--ease) both}
.anim>*:nth-child(2){animation-delay:.04s}.anim>*:nth-child(3){animation-delay:.08s}.anim>*:nth-child(4){animation-delay:.12s}.anim>*:nth-child(5){animation-delay:.16s}.anim>*:nth-child(6){animation-delay:.2s}.anim>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{animation:rise .5s var(--ease) both}
/* nivel */
.level-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.level-n{font-family:var(--display);font-size:52px;font-weight:500;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width 1.1s var(--ease)}
.meta-row{display:flex;justify-content:space-between;margin-top:12px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta-row b{color:var(--ink);font-weight:700}
/* frase */
.quote{font-family:var(--display);font-size:22px;line-height:1.3;letter-spacing:-.01em;margin:10px 0 0;font-weight:500}
.quote-es{margin:10px 0 0;color:var(--muted);font-size:14.5px;font-style:italic;font-family:var(--display);font-weight:400}
.quote-a{margin-top:14px;font-size:13px;color:var(--muted)}
.quote-a::before{content:"— "}
/* filas */
.row{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--sunk)}
.row:first-child{padding-top:0}.row:last-child{padding-bottom:0}
.dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.grow{flex:1;min-width:0}
.row b{font-weight:700}
.st{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--faint);color:transparent}
.st.ok{background:var(--good);border-color:var(--good);color:#fff}
.st.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* tareas */
.task{display:flex;align-items:center;gap:14px;padding:13px 0}
.task+.task{border-top:1px solid var(--sunk)}
.task:first-child{padding-top:0}.task:last-child{padding-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);background:none;flex:none;cursor:pointer;display:grid;place-items:center;color:#fff;transition:background .35s var(--ease),border-color .35s var(--ease),transform .45s var(--spring)}
.check svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .45s var(--ease) .08s}
.task.done .check{background:var(--good);border-color:var(--good);transform:scale(1.08)}
.task.done .check svg path{stroke-dashoffset:0}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .4s var(--ease),opacity .4s}
.task.done .txt{color:var(--muted)}
.task.done .txt span{text-decoration:line-through;text-decoration-color:var(--faint)}
.tag{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.x{background:none;border:0;color:var(--faint);cursor:pointer;padding:6px;font-size:20px;line-height:1;transition:color .2s}
.x:hover{color:var(--bad)}
.leaving{animation:leave .4s var(--ease) both}
@keyframes leave{to{opacity:0;transform:translateX(24px)}}
/* formularios */
.add{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid transparent;border-radius:16px;padding:13px 15px;min-width:0;transition:border-color .25s}
input[type=text]{flex:1 1 180px}
textarea{width:100%;resize:vertical;min-height:96px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{font-weight:700;border:0;border-radius:16px;padding:13px 18px;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .35s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:16px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--surface);border-radius:12px;transition:transform .5s var(--ease)}
.seg button{position:relative;z-index:1;font-weight:700;font-size:14px;border:0;padding:9px;background:none;color:var(--muted);cursor:pointer;transition:color .3s}
.seg button.on{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 14px}
.chips button{font-size:13.5px;font-weight:700;border:0;background:var(--sunk);color:var(--muted);border-radius:99px;padding:7px 14px;cursor:pointer;transition:background .3s,color .3s}
.chips button.on{background:var(--ink);color:var(--bg)}
/* retos */
.q{font-size:18px;font-weight:600;line-height:1.45;margin:8px 0 18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--sunk);background:var(--surface);cursor:pointer;transition:transform .35s var(--spring),background .35s var(--ease),border-color .35s var(--ease),color .35s,opacity .35s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.explain{margin-top:16px;padding:16px;border-radius:16px;background:var(--sunk);font-size:14.5px}
.explain b{display:block;margin-bottom:4px}
.poem{font-family:var(--display);font-size:20px;line-height:1.55;white-space:pre-line;margin:6px 0 0;font-weight:400}
.poem-meta{margin-top:16px;font-size:13.5px;color:var(--muted)}
.poem-meta b{color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.done-pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--good)}
/* progreso */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:34px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
svg text{fill:var(--muted);font-family:var(--ui);font-size:11px}
.barg rect{transform-origin:bottom;transform-box:fill-box;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav .in{position:relative;max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 0}
nav .ind{position:absolute;top:8px;left:0;width:20%;height:46px;display:flex;justify-content:center;transition:transform .55s var(--ease);pointer-events:none}
nav .ind::before{content:"";width:56px;height:100%;border-radius:16px;background:var(--surface)}
nav button{position:relative;z-index:1;font-size:10.5px;font-weight:700;background:none;border:0;color:var(--muted);height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:color .35s}
nav button.on{color:var(--ink)}
nav button svg{transition:transform .45s var(--spring)}
nav button.on svg{transform:translateY(-1px) scale(1.06)}
/* toast, panel, nivel */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px) scale(.9);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .5s var(--spring);z-index:20;white-space:nowrap;font-variant-numeric:tabular-nums}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fadein .3s var(--ease) both}
.sheet{background:var(--bg);width:100%;max-width:500px;border-radius:28px 28px 0 0;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow:auto;animation:up .5s var(--ease) both}
@keyframes fadein{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.switch{display:flex;justify-content:space-between;align-items:center}
.lvlup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.4);animation:fadein .35s var(--ease) both}
.lvlup .box{position:relative;background:var(--bg);border-radius:32px;padding:36px 44px;text-align:center;animation:pop .7s var(--spring) both}
.lvlup .ring{position:absolute;inset:-2px;border-radius:32px;border:2px solid var(--accent);animation:ring 1.4s var(--ease) .2s both;pointer-events:none}
.lvlup b{display:block;font-family:var(--display);font-weight:500;font-size:84px;letter-spacing:-.05em;color:var(--accent);line-height:1}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.note h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.note p{margin:0;white-space:pre-line;overflow-wrap:anywhere;color:var(--muted)}
.note .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.fact{font-size:16px;line-height:1.5;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

let ctx=null,bus=null;
function ac(){try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();
  const master=ctx.createGain();master.gain.value=.9;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;lp.Q.value=.4;
  const dl=ctx.createDelay(1);dl.delayTime.value=.21;const fb=ctx.createGain();fb.gain.value=.3;const wet=ctx.createGain();wet.gain.value=.22;
  lp.connect(master);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);master.connect(ctx.destination);bus=lp}
  if(ctx.state==="suspended")ctx.resume();return ctx}catch(e){return null}}
function tone(f,st,dur,vol){const c=ac();if(!c)return;const t=c.currentTime+st+.01;
  [[f,1,"sine"],[f*2,.12,"sine"],[f*1.003,.35,"triangle"]].forEach(([fr,m,ty])=>{const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(fr,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*m,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05)})}

  const p=S.tasks.filter(t=>!t.done&&f(t)),dn=S.tasks.filter(t=>t.done&&f(t));
  return '<h1>Tareas</h1><div class="anim">'+
  '<form class="add" id="taskForm"><input type="text" id="taskIn" placeholder="Nueva tarea" maxlength="120" autocomplete="off"><select id="taskCat"><option>Escuela</option><option>Casa</option></select><button class="btn" type="submit">Agregar</button></form>'+
  '<div class="chips">'+["Todas","Escuela","Casa"].map(x=>'<button data-act="filter" data-f="'+x+'" class="'+(taskFilter===x?"on":"")+'">'+x+'</button>').join("")+'</div>'+
  (p.length?'<div class="card">'+p.map(taskRow).join("")+'</div>':'<div class="card empty">Todo listo por aquí.</div>')+
  (dn.length?'<div class="sec"><span class="label">Completadas</span><button class="x small" style="font-size:13px;font-weight:700" data-act="cleardone">Limpiar</button></div><div class="card">'+dn.map(taskRow).join("")+'</div>':'')+
  '<p class="small muted" style="margin-top:16px">Cada tarea vale +10 XP.</p></div>';
}

function quiz(item,stt,pick,xp,kind,extra){
  const ans=!!stt;let h='<div class="label">'+(extra?"Reto extra":"Reto del día")+'</div><p class="q">'+esc(item.q)+'</p><div class="opts">';
  item.o.forEach((o,i)=>{let c="";if(ans){c=i===item.a?" right":(i===pick?" wrong":" dim")}h+='<button class="opt'+c+'" data-act="answer" data-k="'+kind+'" data-x="'+(extra?1:0)+'" data-i="'+i+'"'+(ans?" disabled":"")+'>'+esc(o)+'</button>'});
  h+='</div>';
  if(ans)h+='<div class="explain reveal"><b>'+(stt==="ok"?"Correcto":"Casi")+(xp?" · +"+xp+" XP":"")+'</b>'+esc(item.ex)+'</div><div class="actions"><button class="btn accent" data-act="more" data-k="'+kind+'">Otro reto</button></div>';
  return h;
}
function vRetos(){
  const d=L(),it=daily();let body="";
  const tabs=[["logic","Mente"],["eng","English"],["read","Lectura"]],ti=tabs.findIndex(t=>t[0]===retoTab);
  if(retoTab==="logic"||retoTab==="eng"){
    const x=X[retoTab];
    body='<div class="card">'+(x?quiz(x.item,x.st,x.pick,x.xp,retoTab,true):quiz(it[retoTab],d[retoTab],d[retoTab+"Pick"],d[retoTab+"Xp"],retoTab,false))+'</div>';
    if(retoTab==="logic")body+='<p class="small muted" style="margin-top:14px">Piensa antes de responder. Sin IA y sin calculadora.</p>';
    else body+='<div class="card" style="margin-top:12px"><div class="label">Speaking · 30 seconds</div><p class="q" style="margin-bottom:0">'+esc(SPEAK[it.speak])+'</p><div class="actions">'+(d.speak?'<span class="done-pill">'+ic("ck",16,2.4)+'Practicado · +5 XP</span>':'<button class="btn ghost" data-act="speak">Lo dije en voz alta</button>')+'</div></div>';
  } else {
    const extra=X.read!==null,ri=extra?X.read.i:it.read,r=READ[ri],done=extra?X.read.done:d.read;
    body='<div class="card"><div class="label">'+(extra?"Lectura extra":"Lectura del día")+'</div><p class="poem">'+esc(r[3])+'</p><div class="poem-meta"><b>'+esc(r[0])+'</b> · '+esc(r[1])+', '+r[2]+'</div><div class="actions">'+(done?'<span class="done-pill">'+ic("ck",16,2.4)+'Leído</span><button class="btn ghost" data-act="more" data-k="read">Otra lectura</button>':'<button class="btn accent" data-act="read">Lo leí</button>')+'</div></div>'+
    '<div class="card" style="margin-top:12px"><div class="label">Para pensar</div><p class="q" style="margin-bottom:12px">'+esc(r[4])+'</p><textarea id="refl" placeholder="Tu respuesta (se guarda en Notas)"></textarea><div class="actions"><button class="btn ghost" data-act="saverefl">Guardar en notas</button></div></div>';
  }
  return '<h1>Retos</h1><div class="seg"><i style="transform:translateX('+ti*100+'%)"></i>'+tabs.map(([id,n])=>'<button data-act="tab" data-t="'+id+'" class="'+(retoTab===id?"on":"")+'">'+n+'</button>').join("")+'</div><div style="margin-top:16px" class="anim" id="retoBody">'+body+'</div>';
}

function vNotas(){
  return '<h1>Notas</h1><div class="anim">'+
  '<form class="card stack" id="noteForm" style="background:transparent;padding:0"><input type="text" id="noteT" placeholder="Título" maxlength="80"><textarea id="noteB" placeholder="Lo que aprendiste, un resumen, una idea"></textarea><button class="btn" type="submit">Guardar nota</button></form>'+
  '<div class="sec"><span class="label">'+S.notes.length+' '+(S.notes.length===1?"nota":"notas")+'</span></div>'+
  (S.notes.length?'<div class="stack">'+S.notes.map(n=>'<div class="card note"><h3>'+esc(n.t||"Sin título")+'</h3><p>'+esc(n.b)+'</p><div class="meta"><span class="small muted">'+n.d+'</span>'+(delNote===n.id?'<span style="display:flex;gap:6px"><button class="btn ghost" data-act="canceldel">No</button><button class="btn danger" data-act="delnote" data-id="'+n.id+'">Borrar</button></span>':'<button class="x" data-act="askdel" data-id="'+n.id+'" aria-label="Borrar">×</button>')+'</div></div>').join("")+'</div>':'<div class="card empty">Aquí viven tus resúmenes. Cada nota vale +5 XP (hasta 4 al día).</div>')+'</div>';
}

function vProgreso(){
  const lv=lvl(S.xp);let tasks=0,ok=0,ext=0;
  Object.values(S.log).forEach(d=>{tasks+=d.tasks||0;if(d.logic==="ok")ok++;if(d.eng==="ok")ok++;if(d.read)ok++;ext+=d.extra||0});
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({d,xp:(S.log[k(d)]||{}).xp||0})}
  const max=Math.max(50,...days.map(x=>x.xp)),W=320,H=160,pb=24,pt=20,bw=26,gap=(W-bw*7)/6,LET=["D","L","M","M","J","V","S"];
  let bars="";days.forEach((x,i)=>{const h=Math.max(Math.round((H-pb-pt)*x.xp/max),3),xx=i*(bw+gap),isT=i===6;
    bars+='<rect x="'+xx+'" y="'+(H-pb-h)+'" width="'+bw+'" height="'+h+'" rx="8" fill="'+(isT?"var(--accent)":"var(--sunk)")+'" style="animation-delay:'+(i*.05)+'s"/>';
    if(x.xp>0)bars+='<text x="'+(xx+bw/2)+'" y="'+(H-pb-h-6)+'" text-anchor="middle">'+x.xp+'</text>';
    bars+='<text x="'+(xx+bw/2)+'" y="'+(H-6)+'" text-anchor="middle"'+(isT?' style="fill:var(--ink);font-weight:700"':'')+'>'+LET[x.d.getDay()]+'</text>'});
  const week=days.reduce((a,b)=>a+b.xp,0);
  return '<h1>Progreso</h1><div class="anim"><div class="stats">'+
   [["Nivel",lv.l],["XP total",S.xp],["Racha",streak()],["Mejor racha",Math.max(S.best||0,streak())],["Tareas hechas",tasks],["Retos logrados",ok+ext]].map(([a,b])=>'<div class="stat"><span>'+a+'</span><b>'+b+'</b></div>').join("")+
   '</div><div class="sec"><span class="label">Últimos 7 días</span><span class="small muted">'+week+' XP</span></div><div class="card"><svg class="barg" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="XP por día">'+bars+'</svg></div>'+
   '<p class="small muted" style="margin-top:16px">Compara esta gráfica con tu tiempo en juegos y Reels de Bienestar digital.</p></div>';
}

function vSettings(){
  return '<div class="sheet-bg" data-act="close"><div class="sheet" data-stop="1"><h1 style="margin:0">Ajustes</h1>'+
  '<div class="field"><label for="setApp">Nombre de la app</label><input type="text" id="setApp" value="'+esc(S.app)+'" maxlength="16"></div>'+
  '<div class="field"><label for="setUser">Tu nombre</label><input type="text" id="setUser" value="'+esc(S.user)+'" maxlength="24"></div>'+
  '<div class="switch"><b>Sonidos</b><button class="btn '+(S.sound?"accent":"ghost")+'" data-act="sound">'+(S.sound?"Activados":"Apagados")+'</button></div>'+
  (window.PULSO_PWA?'<div class="switch"><span><b>Recordatorio diario</b><br><span class="small muted">'+(S.remind?'Activado':'Te avisa una vez al día')+'</span></span><button class="btn '+(S.remind?'accent':'ghost')+'" data-act="remind">'+(S.remind?'Activado':'Activar')+'</button></div>':'')+'<button class="btn" data-act="saveset">Guardar</button>'+
  (confirmReset?'<div class="card" style="background:var(--bad-soft)"><b>¿Borrar todo tu progreso?</b><div class="small muted" style="margin:4px 0 12px">No se puede deshacer.</div><div style="display:flex;gap:8px"><button class="btn ghost" data-act="noreset">Cancelar</button><button class="btn danger" data-act="doreset">Sí, borrar</button></div></div>':'<button class="btn ghost" data-act="askreset">Borrar todo el progreso</button>')+
  '</div></div>';
}

/* =================== RENDER =================== */
const VIEWS={hoy:vHoy,tareas:vTareas,retos:vRetos,notas:vNotas,progreso:vProgreso};
function buildNav(){document.getElementById("nav").innerHTML='<div class="ind" id="ind"></div>'+NAV.map(([id,n])=>'<button data-act="nav" data-v="'+id+'">'+ic(id,22)+n+'</button>').join("")}
function setNav(){const i=NAV.findIndex(n=>n[0]===view);document.getElementById("ind").style.transform="translateX("+i*100+"%)";document.querySelectorAll("nav button").forEach((b,j)=>b.classList.toggle("on",j===i))}
function render(){
  document.getElementById("brand").innerHTML=esc(S.app)+"<span>.</span>";
  document.getElementById("streakChip").innerHTML=ic("fire",15)+streak();
  const v=document.getElementById("view");v.innerHTML=VIEWS[view]();
  if(!animNext)v.querySelectorAll(".anim").forEach(a=>a.classList.remove("anim"));
  animNext=false;setNav();bindForms();
  const b=document.getElementById("xpbar");if(b){const to=+b.dataset.p;b.style.transition="none";b.style.width=(lastPct===null?0:lastPct)+"%";void b.offsetWidth;b.style.transition="";requestAnimationFrame(()=>{b.style.width=to+"%"});lastPct=to}
}
function go(v){if(view===v)return;view=v;delNote=null;animNext=true;play("nav");render();window.scrollTo({top:0})}
function bindForms(){
  const tf=document.getElementById("taskForm");
  if(tf)tf.onsubmit=e=>{e.preventDefault();const t=document.getElementById("taskIn").value.trim();if(!t)return;S.tasks.unshift({id:S.nextId++,text:t,cat:document.getElementById("taskCat").value,done:false});save();play("tap");render();const r=document.getElementById("t"+(S.nextId-1));if(r)r.classList.add("reveal");document.getElementById("taskIn").focus()};
  const nf=document.getElementById("noteForm");
  if(nf)nf.onsubmit=e=>{e.preventDefault();const t=document.getElementById("noteT").value.trim(),b=document.getElementById("noteB").value.trim();if(!t&&!b)return;addNote(t,b);render()};
}
function addNote(t,b){S.notes.unshift({id:S.nextId++,t,b,d:new Date().toLocaleDateString("es-MX",{day:"numeric",month:"short"})});const d=L();play("check");if(d.notes<4){d.notes++;addXP(5)}else{save();toast("Nota guardada")}}
function extraXP(base){const d=L();d.extra=d.extra||0;if(d.extra>=15)return 0;d.extra++;return base}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.dataset.act==="close"&&e.target.closest("[data-stop]")&&!e.target.closest("button[data-act=close]"))return;
  const a=el.dataset.act,id=+el.dataset.id;
  if(a==="nav")go(el.dataset.v);
  else if(a==="goreto"){retoTab=el.dataset.t;go("retos")}
  else if(a==="tab"){if(retoTab===el.dataset.t)return;retoTab=el.dataset.t;play("tap");const ti=["logic","eng","read"].indexOf(retoTab);const seg=document.querySelector(".seg i");if(seg)seg.style.transform="translateX("+ti*100+"%)";document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===retoTab));setTimeout(()=>{animNext=true;render()},180)}
  else if(a==="filter"){taskFilter=el.dataset.f;play("tap");animNext=true;render()}
  else if(a==="toggle"){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;const d=L();const row=document.getElementById("t"+id);if(row)row.classList.toggle("done",t.done);
    if(t.done){d.tasks++;play("check");addXP(10)}else{d.tasks=Math.max(0,d.tasks-1);play("uncheck");addXP(-10)}
    setTimeout(()=>{if(row&&view==="hoy"&&t.done){row.classList.add("leaving");setTimeout(render,380)}else render()},650)}
  else if(a==="deltask"){const row=document.getElementById("t"+id);S.tasks=S.tasks.filter(x=>x.id!==id);save();play("del");if(row){row.classList.add("leaving");setTimeout(render,380)}else render()}
  else if(a==="cleardone"){S.tasks=S.tasks.filter(x=>!x.done);save();play("del");animNext=true;render()}
  else if(a==="answer"){
    const kind=el.dataset.k,extra=el.dataset.x==="1",i=+el.dataset.i,d=L();
    let item,right,xp;
    if(extra){const x=X[kind];if(!x||x.st)return;item=x.item;right=i===item.a;xp=extraXP(right?5:1);x.st=right?"ok":"no";x.pick=i;x.xp=xp}
    else{if(d[kind])return;item=daily()[kind];right=i===item.a;xp=right?15:3;d[kind]=right?"ok":"no";d[kind+"Pick"]=i;d[kind+"Xp"]=xp}
    document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;b.classList.add(j===item.a?"right":j===i?"wrong":"dim")});
    play(right?"ok":"bad");if(xp)addXP(xp);else save();
    setTimeout(render,520)}
  else if(a==="more"){const kind=el.dataset.k;play("open");
    if(kind==="logic")X.logic={item:Math.random()<.35?fromArr(LOGIC[nextFrom("logic",LOGIC.length)]):genLogic(),st:null};
    else if(kind==="eng")X.eng={item:Math.random()<.3?fromArr(GRAM[nextFrom("gram",GRAM.length)]):genEng(),st:null};
    else X.read={i:nextFrom("read",READ.length),done:false};
    const rb=document.getElementById("retoBody");if(rb){rb.style.transition="opacity .2s, transform .2s";rb.style.opacity="0";rb.style.transform="translateY(-6px)"}
    setTimeout(()=>{animNext=true;render();window.scrollTo({top:0,behavior:"smooth"})},200)}
  else if(a==="speak"){const d=L();if(d.speak)return;d.speak=true;play("check");addXP(5);render()}
  else if(a==="read"){if(X.read){if(X.read.done)return;X.read.done=true;play("ok");const xp=extraXP(5);if(xp)addXP(xp);else save()}else{const d=L();if(d.read)return;d.read=true;play("ok");addXP(10)}render()}
  else if(a==="saverefl"){const v=(document.getElementById("refl")||{}).value||"";if(!v.trim()){toast("Escribe algo primero");return}const r=READ[X.read?X.read.i:daily().read];addNote("Lectura: "+r[0],v.trim());render()}
  else if(a==="askdel"){delNote=id;play("tap");render()}
  else if(a==="canceldel"){delNote=null;render()}
  else if(a==="delnote"){S.notes=S.notes.filter(n=>n.id!==id);delNote=null;save();play("del");render()}
  else if(a==="settings"){confirmReset=false;play("open");document.getElementById("overlay").innerHTML=vSettings()}
  else if(a==="sound"){S.sound=!S.sound;save();play("tap");const b=el;b.textContent=S.sound?"Activados":"Apagados";b.className="btn "+(S.sound?"accent":"ghost")}
  else if(a==="saveset"){S.app=document.getElementById("setApp").value.trim()||"Pulso";S.user=document.getElementById("setUser").value.trim()||"Noé";save();play("check");closeOverlay()}
  else if(a==="askreset"){confirmReset=true;document.getElementById("overlay").innerHTML=vSettings();document.querySelector(".sheet").style.animation="none";document.querySelector(".sheet-bg").style.animation="none"}
  else if(a==="noreset"){confirmReset=false;document.getElementById("overlay").innerHTML=vSettings();document.querySelector(".sheet").style.animation="none";document.querySelector(".sheet-bg").style.animation="none"}
  else if(a==="doreset"){S=JSON.parse(JSON.stringify(DEF));save();lastPct=0;X.logic=X.eng=X.read=null;view="hoy";play("del");closeOverlay(true)}
  else if(a==="remind"){enableRemind(el)}
  else if(a==="close")closeOverlay();
});
function closeOverlay(full){const o=document.getElementById("overlay"),sh=o.querySelector(".sheet"),bg=o.firstElementChild;
  if(sh){sh.style.transition="transform .35s cubic-bezier(.22,1,.36,1)";sh.style.transform="translateY(100%)"}
  if(bg){bg.style.transition="opacity .35s";bg.style.opacity="0"}
  setTimeout(()=>{o.innerHTML="";if(full)animNext=true;render()},sh||bg?320:0)}

async function enableRemind(btn){
  try{
    if(!("Notification" in window)){toast("Tu navegador no permite notificaciones");return}
    const p=await Notification.requestPermission();
    if(p!=="granted"){toast("Permiso de notificaciones negado");return}
    const reg=await navigator.serviceWorker.ready;
    let ok=false;
    if("periodicSync" in reg){try{await reg.periodicSync.register("pulso-daily",{minInterval:24*60*60*1000});ok=true}catch(e){}}
    reg.showNotification(S.app,{body:"Así se verán tus recordatorios. ¡Tu reto del día te espera!",icon:"icons/icon-192.png",badge:"icons/icon-192.png"});
    S.remind=true;save();play("check");
    btn.textContent="Activado";btn.className="btn accent";
    if(!ok)toast("Instala la app para recibir el aviso diario");
  }catch(e){toast("No se pudo activar el recordatorio")}
}
if(window.PULSO_PWA&&"serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
buildNav();render();
</script>

</body></html>
