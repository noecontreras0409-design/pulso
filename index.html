:root{--ink:#3A2216;--ink2:#7A5434;--paper:#F4E2B8;--paperL:#FFF4D6;--paperD:#E2C690;--wood:#B8763A;--woodD:#8A4E22;--woodL:#D9984E;--green:#3F9A4A;--greenD:#2E7A38;--red:#C0402E;--gold:#F7C82E;--ui:"Pix","Courier New",monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#2E4A2A;color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#cv{position:fixed;inset:0;display:block;image-rendering:pixelated}
/* marco pixel */
.fr{position:relative;background:var(--paper);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--wood),inset 0 0 0 5px var(--paperL),inset 0 -8px 0 0 rgba(226,198,144,.6);
  clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px 10px;font-weight:700;font-size:17px;color:#FFF4D6;background:var(--wood);border:3px solid var(--ink);
  box-shadow:inset 0 3px 0 var(--woodL),inset 0 -4px 0 var(--woodD);text-shadow:0 2px 0 rgba(58,34,22,.6);
  clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 3px 0 var(--woodD),inset 0 -1px 0 var(--woodD)}
.btn.g{background:var(--green);box-shadow:inset 0 3px 0 #5DBA5E,inset 0 -4px 0 var(--greenD)}
.btn.r{background:var(--red);box-shadow:inset 0 3px 0 #E06A48,inset 0 -4px 0 #8A2C1E}
.btn[disabled]{filter:grayscale(1) brightness(.85);opacity:.6;pointer-events:none}
.btn.sq{width:52px;height:52px;padding:0}
.btn canvas,.ico{width:28px;height:28px;image-rendering:pixelated}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{position:absolute;pointer-events:auto}
#tl{left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
#money{display:flex;align-items:center;gap:8px;padding:6px 14px 8px 10px;font-weight:700;font-size:24px;min-width:150px}
#lvl{display:flex;align-items:center;gap:8px;padding:5px 12px 7px 8px;font-size:14px;font-weight:700}
#lvl .bar{width:90px;height:8px;background:#C9A874;border:2px solid var(--ink);margin-top:3px}
#lvl .bar i{display:block;height:100%;background:#5DBA5E}
#tc{left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:4px}
#season{display:flex;align-items:center;gap:8px;padding:6px 16px 8px 10px;font-weight:700;font-size:19px;white-space:nowrap}
#tip{background:rgba(58,34,22,.85);color:var(--paperL);font-size:14px;padding:5px 10px;max-width:50vw;text-align:center;line-height:1.3}
#tr{right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px}
#bot{left:calc(max(10px,env(safe-area-inset-left)) + 150px);bottom:max(6px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:7px 8px 9px;max-width:calc(100vw - 480px);overflow-x:auto;scrollbar-width:none}
#bot::-webkit-scrollbar{display:none}
.seed{position:relative;flex:none;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:#EAD3A2;border:3px solid #C9A464;padding-top:2px}
.seed canvas{width:36px;height:36px;image-rendering:pixelated}
.seed b{font-size:12px;line-height:1}
.seed b img{width:10px;height:10px;vertical-align:-1px;image-rendering:pixelated}
.seed.on{border-color:var(--ink);background:var(--paperL);box-shadow:0 0 0 2px var(--gold)}
.seed.out{filter:grayscale(.85);opacity:.65}
.seed .lk{position:absolute;inset:0;background:rgba(234,211,162,.85);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#bl{left:max(10px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px}
#br{right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px}
#barnTag{display:flex;align-items:center;gap:6px;padding:6px 12px 8px 8px;font-weight:700;font-size:15px}

.pop{position:fixed;z-index:9;transform:translate(-50%,0);font-weight:700;font-size:20px;color:#FFE07A;text-shadow:2px 0 #3A2216,-2px 0 #3A2216,0 2px #3A2216,0 -2px #3A2216;pointer-events:none;animation:popup 1.4s steps(14) forwards;display:flex;align-items:center;gap:4px}
.pop img{width:18px;height:18px;image-rendering:pixelated}
@keyframes popup{to{transform:translate(-50%,-60px);opacity:0}}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .3s;z-index:30;pointer-events:none;padding:8px 16px 10px;font-weight:700;font-size:17px;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:26;pointer-events:none;padding:14px 34px 18px;font-weight:700;font-size:34px;text-align:center;transition:opacity .4s,transform .5s cubic-bezier(.34,1.5,.64,1)}
#banner small{display:block;font-size:16px;font-weight:400;color:var(--ink2);margin-top:4px}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* ventanas */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(30,20,10,.5);padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.win{width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;animation:pop .25s steps(4)}
@keyframes pop{from{transform:scale(.85)}}
.wh{display:flex;align-items:center;gap:10px;padding:12px 14px 6px 16px}
.wh h2{margin:0;flex:1;font-size:26px}
.wh .ico{width:34px;height:34px}
.wb{padding:6px 16px 16px;overflow:auto;min-height:0}
.tabs{display:flex;gap:4px;padding:0 14px;flex-wrap:wrap}
.tabs button{padding:6px 12px;font-weight:700;font-size:15px;background:#E2C690;border:3px solid var(--ink);border-bottom:0;color:var(--ink2)}
.tabs button.on{background:var(--paperL);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,244,214,.7);border:3px solid #C9A464;margin-top:6px}
.row .n{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.15}
.row .n small{display:block;font-weight:400;font-size:13.5px;color:var(--ink2)}
.row canvas{width:40px;height:40px;image-rendering:pixelated;flex:none}
.price{display:inline-flex;align-items:center;gap:3px;font-weight:700;white-space:nowrap}
.price img{width:14px;height:14px;image-rendering:pixelated}
.sec{font-weight:700;font-size:14px;color:var(--ink2);margin:12px 0 2px;letter-spacing:.04em;text-transform:uppercase}
.bar2{height:12px;background:#C9A874;border:2px solid var(--ink);margin-top:5px}.bar2 i{display:block;height:100%;background:#5DBA5E}
.tog{min-width:92px}
p.t{font-size:16px;line-height:1.45;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.grid .row{margin:0}
#splash{position:fixed;inset:0;z-index:40;width:100%;height:100%}
#rot{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#2E4A2A;color:var(--paperL);font-size:20px;font-weight:700;text-align:center;padding:30px}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}

<script>
/* ===== Motor de pixel art de MyGarden (dibujado desde cero) ===== */
var PX=(function(){
let g=null,W=0,H=0,season='spring';
function set(ctx,w,h){g=ctx;W=w;H=h}
function setSeason(s){season=s}
function rnd(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0}
function p(x,y,c){g.fillStyle=c;g.fillRect(x|0,y|0,1,1)}
function r(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)}
function line(x0,y0,x1,y1,c){x0|=0;y0|=0;x1|=0;y1|=0;let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,e=dx+dy;for(;;){p(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function disc(cx,cy,rad,c){for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++)if(x*x+y*y<=rad*rad+rad*.8)p(cx+x,cy+y,c)}
function ell(cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++)if((x*x)/(rx*rx+.5)+(y*y)/(ry*ry+.5)<=1)p(cx+x,cy+y,c)}
// paletas por temporada
const PAL={
 spring:{g0:'#5FB43E',g1:'#4E9C33',g2:'#79C94F',g3:'#3E8229',d0:'#E3A24A',d1:'#D18F3A',d2:'#EDB866',d3:'#B8762E',leaf:['#2F6E2A','#3F8A2E','#56A83A','#7CC44E'],fl:['#FFFFFF','#F7D24A','#F08AB4','#9F8BE8']},
 summer:{g0:'#4FA837',g1:'#3F902C',g2:'#6ABD46',g3:'#327522',d0:'#E7A645',d1:'#D49035',d2:'#F0BC60',d3:'#BA772A',leaf:['#22602A','#2F7A2E','#45963A','#67B347'],fl:['#F7D24A','#F07040','#FFFFFF','#E84B5A']},
 autumn:{g0:'#A3A84A',g1:'#8A8F3A',g2:'#BDBE5E',g3:'#6E742C',d0:'#DE9A48',d1:'#C9853A',d2:'#EAB264',d3:'#AE6C2E',leaf:['#8A3A1E','#B9562A','#E0843A','#F2B04E'],fl:['#E0843A','#F2B04E','#B9562A','#FFFFFF']},
 winter:{g0:'#E9F0F6',g1:'#D3DFEA',g2:'#FFFFFF',g3:'#B9C9D9',d0:'#D9E2EA',d1:'#C5D2DE',d2:'#F4F8FB',d3:'#AEBFCF',leaf:['#5E7068','#7A8C84','#9AABA3','#C5D2CE'],fl:['#FFFFFF','#E9F0F6','#D3DFEA','#C5D2DE']}
};
const OUT='#3A2216',OUT2='#4A2C1C';
function pal(){return PAL[season]}

/* ---------- suelos ---------- */
function grass(tx,ty){const P=pal();const x0=tx*16,y0=ty*16,h=h2(tx,ty);
  r(x0,y0,16,16,P.g0);
  // manchas suaves y ordenadas (sin ruido)
  if(h%4===0){r(x0+2,y0+5,6,3,P.g2);r(x0+3,y0+4,4,1,P.g2);r(x0+3,y0+8,4,1,P.g2)}
  // matas en forma de "v"
  const tuft=(x,y,c,c2)=>{p(x,y,c);p(x-1,y-1,c);p(x+1,y-1,c);p(x-2,y-2,c2);p(x+2,y-2,c2);p(x,y-1,c2)};
  const n=1+(h>>3)%2;
  for(let k=0;k<n;k++){const hh=h2(tx*5+k,ty*9+k);tuft(x0+3+(hh%10),y0+5+((hh>>4)%9),P.g1,P.g3)}
  if(h%3===1){const hh=h2(tx+7,ty+3);const x=x0+3+(hh%10),y=y0+3+((hh>>5)%10);p(x,y,P.g1);p(x+1,y-1,P.g1)}
  if(season!=='winter'&&h%9===2){const x=x0+4+((h>>2)%8),y=y0+4+((h>>6)%8),c=P.fl[h%4];p(x,y-1,c);p(x-1,y,c);p(x+1,y,c);p(x,y+1,c);p(x,y,'#F7D24A');p(x,y+2,P.g1);p(x+1,y+3,P.g1)}
  if((season==='autumn'||season==='muertos')&&h%6===3){const x=x0+3+((h>>3)%10),y=y0+3+((h>>8)%10);p(x,y,'#C9602E');p(x+1,y,'#E0843A');p(x+1,y-1,'#E0843A')}
  if(season==='winter'&&h%5===1){const x=x0+3+((h>>3)%10),y=y0+4+((h>>8)%9);r(x,y,3,1,P.g2);p(x+1,y-1,P.g2)}
}
function dirt(tx,ty){const P=pal();const x0=tx*16,y0=ty*16,h=h2(tx,ty);r(x0,y0,16,16,P.d0);
  if(h%3===0){r(x0+3,y0+4,5,2,P.d2);r(x0+4,y0+3,3,1,P.d2)}
  if(h%3===1){r(x0+9,y0+10,4,2,P.d1);r(x0+10,y0+12,2,1,P.d1)}
  for(let i=0;i<2;i++){const hh=h2(tx*31+i,ty*17+i);p(x0+2+(hh%12),y0+2+((hh>>5)%12),P.d3)}
  if(h%5===0){const x=x0+3+(h%9),y=y0+4+((h>>4)%8);r(x,y,3,2,'#B9A890');r(x,y,2,1,'#DCCFBA');r(x,y+2,3,1,'#8C7B62')}}
function soil(tx,ty,wet){const x0=tx*16,y0=ty*16;
  const a=wet?'#6E3E1E':'#9C5B2E',b=wet?'#5A3218':'#844A24',c2=wet?'#87502A':'#B5713C';
  r(x0+1,y0+1,14,14,a);r(x0+1,y0+14,14,1,b);
  for(let k=0;k<3;k++){r(x0+2,y0+3+k*4,12,1,c2);r(x0+2,y0+4+k*4,12,1,b)}
  p(x0+1,y0+1,'rgba(0,0,0,0)');
  r(x0+1,y0,14,1,OUT2);r(x0+1,y0+15,14,1,OUT2);r(x0,y0+1,1,14,OUT2);r(x0+15,y0+1,1,14,OUT2);
  if(season==='winter'){for(let i=0;i<10;i++){const h=h2(tx*9+i,ty*5);p(x0+2+(h%12),y0+2+((h>>4)%12),'#F4F8FB')}}
}
function path(tx,ty){const x0=tx*16,y0=ty*16;const base=season==='winter'?'#E3E9EF':'#E6C487',d=season==='winter'?'#C9D3DD':'#D3AE6E',l=season==='winter'?'#F7FAFC':'#F2D9A2';
  r(x0,y0,16,16,base);for(let i=0;i<3;i++){const h=h2(tx*13+i,ty*29);const x=x0+2+(h%11),y=y0+2+((h>>5)%11);r(x,y,2,1,(h>>10)%2?d:l)}
  const h=h2(tx,ty);if(h%3===0){const x=x0+3+(h%9),y=y0+4+((h>>4)%8);r(x,y,3,2,'#B9A88C');r(x,y,2,1,'#DCCDB2');r(x,y+2,3,1,'#8C7B62')}}
function water(tx,ty,t){const x0=tx*16,y0=ty*16;const ice=season==='winter';
  r(x0,y0,16,16,ice?'#BFE0F0':'#4A9FD0');
  for(let i=0;i<2;i++){const h=h2(tx*7+i,ty*3);const x=x0+2+(h%9),y=y0+3+((h>>4)%10);r(x+(((t*2+i)|0)%2),y,4,1,ice?'#E8F6FC':'#7CC0E6')}
  if(!ice){const h=h2(tx,ty);if(h%3===0){const x=x0+4+(h%6),y=y0+5+((h>>3)%6);r(x,y,5,3,'#3E8A2E');r(x+1,y-1,3,1,'#3E8A2E');r(x+1,y,2,1,'#5DAA3C');if(h%2){p(x+2,y-2,'#F08AB4');p(x+1,y-1,'#F08AB4');p(x+3,y-1,'#F08AB4');p(x+2,y-1,'#FBD8E6')}}}
}
function shore(tx,ty,nb){const x0=tx*16,y0=ty*16,c1=season==='winter'?'#9FB8C8':'#2E6E8E',c2=season==='winter'?'#F4F8FB':'#E6C487',c3=season==='winter'?'#C9D3DD':'#C9A464';
  if(!nb.u){r(x0,y0,16,2,c2);r(x0,y0+2,16,1,c3);r(x0,y0+3,16,1,c1)}
  if(!nb.d){r(x0,y0+14,16,2,c2);r(x0,y0+13,16,1,c3)}
  if(!nb.l){r(x0,y0,2,16,c2);r(x0+2,y0,1,16,c3);r(x0+3,y0,1,16,c1)}
  if(!nb.r){r(x0+14,y0,2,16,c2);r(x0+13,y0,1,16,c3)}
  if(!nb.u&&!nb.l){r(x0,y0,5,5,c2);r(x0+3,y0+3,2,2,c3)}if(!nb.u&&!nb.r){r(x0+11,y0,5,5,c2);r(x0+11,y0+3,2,2,c3)}
  if(!nb.d&&!nb.l){r(x0,y0+11,5,5,c2)}if(!nb.d&&!nb.r){r(x0+11,y0+11,5,5,c2)}
}

/* ---------- cultivos (casilla 16x16, ancla arriba-izq) ---------- */
function plantCrop(tx,ty,type,stage){const x=tx*16,y=ty*16;
  const G1='#2F7A2E',G2='#45A83A',G3='#7CCB4E',O=OUT;
  if(stage===0){[[4,6],[10,5],[6,11],[11,10]].forEach(q=>{p(x+q[0],y+q[1],'#4A2A14');p(x+q[0]+1,y+q[1],'#C9A464')});return}
  if(stage===1){[[5,10],[10,9]].forEach(q=>{p(x+q[0],y+q[1],G1);p(x+q[0],y+q[1]-1,G2);p(x+q[0]-1,y+q[1]-2,G3);p(x+q[0]+1,y+q[1]-2,G2)});return}
  if(type==='lettuce'){ // lechuga / col
    const cx=x+8,cy=y+9;ell(cx,cy,6,5,O);ell(cx,cy,5,4,G1);ell(cx,cy-1,4,3,G2);ell(cx-1,cy-2,2,2,G3);p(cx+2,cy-1,'#A6E070');line(cx-3,cy+2,cx+3,cy+2,'#246024');p(cx,cy,'#C9F08A');
  }
  if(type==='tomato'){ // mata con estaca y tomates
    const cx=x+8;line(cx+3,y+1,cx+3,y+14,'#7A4A22');p(cx+3,y+1,'#A86A34');
    for(let i=0;i<4;i++){const yy=y+3+i*3;ell(cx-1,yy+1,4,2,O);ell(cx-1,yy+1,3,1,i%2?G1:G2);p(cx-3,yy,G3);}
    if(stage>=3)[[cx-3,y+5],[cx+1,y+8],[cx-2,y+11],[cx+1,y+3]].forEach(q=>{r(q[0]-1,q[1]-1,3,3,O);r(q[0]-1,q[1]-1,2,2,'#E63B3B');p(q[0],q[1],'#B32424');p(q[0]-1,q[1]-1,'#FF8A80')});
  }
  if(type==='carrot'){ const cx=x+8;
    for(let i=-1;i<=1;i++){line(cx+i*2,y+11,cx+i*4,y+4,G1);p(cx+i*4,y+3,G2);p(cx+i*4-1,y+4,G3);p(cx+i*4+1,y+5,G2)}
    if(stage>=3){r(cx-2,y+11,5,3,O);r(cx-1,y+11,3,2,'#F08A2E');p(cx-1,y+11,'#FFB060')}
  }
  if(type==='strawberry'){ [[4,9],[11,8],[8,12]].forEach(q=>{ell(x+q[0],y+q[1],3,2,O);ell(x+q[0],y+q[1],2,1,G2);p(x+q[0]-1,y+q[1]-1,G3)});
    if(stage>=3)[[6,11],[10,11],[8,7]].forEach(q=>{r(x+q[0]-1,y+q[1]-1,3,3,O);r(x+q[0]-1,y+q[1]-1,2,2,'#E8324A');p(x+q[0]-1,y+q[1]-1,'#FF7A88');p(x+q[0],y+q[1]-2,G2)}) }
  if(type==='sunflower'){ const cx=x+8;line(cx,y+15,cx,y+4,G1);ell(cx-3,y+10,2,1,G2);ell(cx+3,y+8,2,1,G2);
    if(stage>=3){disc(cx,y+3,4,O);disc(cx,y+3,3,'#F7C82E');disc(cx,y+3,1,'#6B3A16');p(cx-2,y+1,'#FFE07A')} else {disc(cx,y+4,2,G2)} }
  if(type==='pumpkin'){ line(x+1,y+10,x+15,y+9,G1);ell(x+4,y+8,2,2,G2);ell(x+12,y+7,2,2,G2);
    if(stage>=3){ell(x+8,y+10,6,4,O);ell(x+8,y+10,5,3,'#E8892A');line(x+5,y+8,x+5,y+12,'#C46A1A');line(x+11,y+8,x+11,y+12,'#C46A1A');p(x+6,y+8,'#FFB060');r(x+8,y+5,2,2,'#5A3A1A')} }
  if(type==='corn'){ for(let k=-1;k<=1;k+=2){const cx=x+8+k*3;line(cx,y+15,cx,y+1,G1);ell(cx+k*2,y+9,2,1,G2);ell(cx-k*2,y+5,2,1,G2);if(stage>=3){r(cx-1,y+6,3,5,O);r(cx,y+6,1,4,'#F7D24A');p(cx,y+5,'#C9E07A')}} }
}

/* ---------- objetos ---------- */
function fenceH(x,y,w){const P=['#A8642E','#C98A48','#7A4320'];
  for(let i=0;i<w;i++){r(x+i,y+4,1,2,P[1]);p(x+i,y+4,P[0]);r(x+i,y+9,1,2,P[1]);p(x+i,y+10,P[2])}
  r(x,y+3,w,1,OUT);r(x,y+6,w,1,OUT);r(x,y+8,w,1,OUT);r(x,y+11,w,1,OUT);
  for(let i=0;i<w;i+=16)post(x+i+6,y);}
function post(x,y){r(x-1,y-1,6,15,OUT);r(x,y,4,13,'#B87536');r(x,y,1,13,'#D99A55');r(x+3,y,1,13,'#8A4E22');r(x,y,4,2,'#E2AA66');if(season==='winter')r(x-1,y-2,6,3,'#FFFFFF')}
function fenceV(x,y,h){for(let j=0;j<h;j+=12)post(x,y+j)}
function tree(cx,by,kind){ // kind: oak / fruit / blossom
  const P=pal();let L=P.leaf;
  if(kind==='blossom'&&season==='spring')L=['#B8507A','#D8709A','#F0A0C0','#FFD0E0'];
  if(kind==='fruit'&&season!=='winter')L=['#22602A','#2F7A2E','#45963A','#67B347'];
  // sombra
  for(let y=-3;y<=3;y++)for(let x=-14;x<=14;x++)if(x*x/196+y*y/9<=1)p(cx+x+4,by+y,'rgba(30,50,20,.28)');
  // tronco
  r(cx-4,by-18,8,18,OUT);r(cx-3,by-18,6,17,'#7A4A26');r(cx-3,by-18,2,17,'#9C6234');r(cx+2,by-18,1,17,'#5A3218');
  r(cx-6,by-2,12,2,OUT);r(cx-5,by-2,10,1,'#7A4A26');p(cx-1,by-10,'#5A3218');p(cx,by-6,'#5A3218');
  if(season==='winter'&&kind!=='pine'){ // ramas desnudas
    line(cx,by-16,cx-9,by-28,OUT);line(cx,by-16,cx+8,by-30,OUT);line(cx,by-18,cx,by-34,OUT);line(cx-5,by-22,cx-12,by-24,OUT);line(cx+4,by-24,cx+12,by-26,OUT);
    line(cx-9,by-29,cx-9,by-29,'#FFFFFF');[[cx-9,by-29],[cx+8,by-31],[cx,by-35],[cx-12,by-25],[cx+12,by-27]].forEach(q=>{r(q[0]-1,q[1]-1,3,2,'#FFFFFF')});return}
  // copa en capas
  const blobs=[[0,-30,13],[-9,-24,9],[9,-24,9],[-5,-36,8],[6,-35,8],[0,-20,10]];
  blobs.forEach(b=>disc(cx+b[0],by+b[1],b[2]+1,OUT));
  blobs.forEach(b=>disc(cx+b[0],by+b[1],b[2],L[0]));
  [[1,-31,11],[-8,-25,7],[9,-25,7],[-4,-36,7],[6,-35,6],[1,-22,8]].forEach(b=>disc(cx+b[0]-1,by+b[1]-1,b[2]-1,L[1]));
  [[-2,-33,7],[-9,-27,4],[6,-28,4],[-5,-38,4],[4,-37,3]].forEach(b=>disc(cx+b[0]-1,by+b[1]-1,b[2],L[2]));
  [[-4,-35,3],[-10,-28,2],[3,-30,2],[-6,-39,2]].forEach(b=>disc(cx+b[0],by+b[1],b[2],L[3]));
  // textura de hojas
  for(let i=0;i<12;i++){const h=h2(cx+i,by-i*3);const a=(h%628)/100,d=(h>>9)%13;const x=cx+Math.round(Math.cos(a)*d),y=by-29+Math.round(Math.sin(a)*d*.9);p(x,y,L[(h>>4)%2?0:2])}
  if(kind==='fruit'&&season!=='winter')[[-7,-26],[5,-32],[9,-22],[-3,-21],[-1,-36],[10,-30]].forEach(q=>{r(cx+q[0]-1,by+q[1]-1,3,3,OUT);r(cx+q[0]-1,by+q[1]-1,2,2,season==='autumn'?'#F2A23A':'#F07A2A');p(cx+q[0]-1,by+q[1]-1,'#FFD07A')});
  if(kind==='blossom'&&season==='spring')for(let i=0;i<14;i++){const h=h2(cx*3+i,by);p(cx-12+(h%24),by-40+((h>>5)%26),'#FFFFFF')}
}
function pine(cx,by){const win=season==='winter';
  const L=win?['#1E3A2E','#2C4A3A','#3A5E4A','#4E745E']:['#163E26','#1F5230','#2A6A3C','#3C844A'];
  // sombra
  for(let y=-3;y<=3;y++)for(let x=-12;x<=12;x++)if(x*x/144+y*y/9<=1)p(cx+x+4,by+y,'rgba(30,50,20,.28)');
  // tronco
  r(cx-3,by-10,6,11,OUT);r(cx-2,by-10,4,10,'#6A3E1E');p(cx-2,by-9,'#8A5A30');p(cx-2,by-6,'#8A5A30');p(cx+1,by-4,'#4A2A14');
  // 4 pisos de ramas, cada uno más angosto hacia arriba
  const tiers=[[13,by-8,13],[11,by-16,12],[9,by-24,11],[6,by-31,10]];
  tiers.forEach(([w,base,hgt],ti)=>{
    // contorno
    for(let j=0;j<hgt;j++){const ww=Math.round(w*(1-j/hgt));r(cx-ww-1,base-j,ww*2+3,1,OUT)}
    r(cx-1,base-hgt,3,1,OUT);
    // relleno con luz a la izquierda y sombra a la derecha
    for(let j=0;j<hgt-1;j++){const ww=Math.round((w-1)*(1-j/hgt));
      r(cx-ww,base-j,ww*2+1,1,L[1]);
      r(cx+1,base-j,Math.max(0,ww),1,L[0]);
      r(cx-ww,base-j,Math.max(1,Math.round(ww*.55)),1,L[2]);

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,k=el.dataset.k;ac();
  if(a==='close'){sfx('close');closeModal()}
  else if(a==='seed'){const C=CROPS[k];if(S.lv<C.lv){toast(C.n+' se desbloquea en nivel '+C.lv);sfx('no');return}S.sel=k;sfx('tap');renderSeeds();if(!C.s.includes(season()))toast(C.n+(S.lots.includes(11)?' solo crecerá en el invernadero ahora':' no es de esta temporada'))}
  else if(a==='market'){sfx('open');openMarket(el.dataset.t)}
  else if(a==='scene'){setScene(scene==='farm'?'town':'farm')}
  else if(a==='barn'){sfx('open');openBarn()}
  else if(a==='build'){sfx('open');openBuild(el.dataset.t)}
  else if(a==='orders'){sfx('open');openOrders()}
  else if(a==='menu'){sfx('open');openMenu()}
  else if(a==='togsell'){S.sellOff[k]=!S.sellOff[k];sfx('tap');openMarket()}
  else if(a==='upg'){const u=UPG[k],lv=S.up[k]||0,p=u.p[lv];if(S.coins<p)return;S.coins-=p;S.up[k]=lv+1;sfx('buy');addXP(5);if(k==='barn')openBarn();else if(k==='sprinkler')openBuild('farm');else openMarket();save()}
  else if(a==='buymach'){const M=MACH[k];if(S.coins<M.price)return;S.coins-=M.price;S.mach[k]={job:null};sfx('buy');addXP(M.big?40:15);if(scene!=='farm')setScene('farm');buildWorld();closeModal();const po=padOf(k);focus(po.x,po.y+30);banner(M.big?'¡Abriste tu '+M.n.toLowerCase()+'!':'¡Taller construido!',M.big?'Toca el edificio para preparar productos':'Taller de '+M.n.toLowerCase());renderSeeds()}
  else if(a==='buytree'){const F=FRUITS[k],i=SPOTS.findIndex((s,j)=>!S.trees[j]);if(i<0||S.coins<F.price)return;S.coins-=F.price;S.trees[i]={k,done:Date.now()+F.t*1000*speedMul()};sfx('buy');addXP(10);buildWorld();closeModal();focus(SPOTS[i][0]*T+16,SPOTS[i][1]*T);banner('¡'+F.tree+' plantado!','Dará fruta cada '+Math.round(F.t/60*10)/10+' min')}
  else if(a==='buylot'){const L=LOTS[+k];if(S.coins<L.price||S.lv<L.lv)return;S.coins-=L.price;S.lots.push(L.i);sfx('buy');addXP(10);buildWorld();renderSeeds();closeModal();focus((L.x+3)*T,(L.y+2)*T);banner(L.gh?'¡Invernadero listo!':'¡Terreno nuevo!',L.gh?'Cultiva todo el año':'24 parcelas más')}
  else if(a==='make'){const M=MACH[k],r=M.rec[+el.dataset.i],m=S.mach[k];if(m.job)return;if(!Object.entries(r.in).every(([k2,n])=>(S.inv[k2]||0)>=n))return;Object.entries(r.in).forEach(([k2,n])=>{S.inv[k2]-=n;if(!S.inv[k2])delete S.inv[k2]});m.job={out:r.out,xp:r.xp,start:Date.now(),done:Date.now()+r.t*1000};sfx('plant');closeModal()}
  else if(a==='deliver'){const o=S.orders[+el.dataset.i];if(!Object.entries(o.items).every(([k2,n])=>(S.inv[k2]||0)>=n))return;Object.entries(o.items).forEach(([k2,n])=>{S.inv[k2]-=n;if(!S.inv[k2])delete S.inv[k2]});S.coins+=o.reward;S.st.earned+=o.reward;addXP(o.xp);S.orders.splice(+el.dataset.i,1);sfx('coin');sfx('buy');toast('+'+o.reward+' monedas');openOrders()}
  else if(a==='skip'){S.orders.splice(+el.dataset.i,1);sfx('tap');openOrders()}
  else if(a==='notif'){Notification.requestPermission().then(p=>{if(p==='granted'){window.__swReg.showNotification('MyGarden',{body:'¡Listo! Te avisaré cuando cambie la temporada.',icon:'icon-192.png'});sfx('buy')}openMenu()})}
  else if(a==='music'){S.music=!S.music;openMenu()}else if(a==='sfx'){S.sfx=!S.sfx;openMenu()}
  else if(a==='reset')openMenu(true);
  else if(a==='reset2'){try{localStorage.removeItem(KEY)}catch(x){}S=fresh();customers=[];buildWorld();renderSeeds();closeModal();centerStart();S.intro=true;banner('Una semilla nueva','Empieza otra vez')}
});
$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal'){sfx('close');closeModal()}});
function focus(x,y){const pw=cv.width/SC,ph=cv.height/SC;camT={x:x-pw/2,y:y-ph/2}}
let camT=null;
// toque / arrastre / pellizco
const ptrs=new Map();let mode=null,start=null,lastTile=null,pinch0=0,zoom0=0,moved=false;
function toWorld(sx,sy){return [cam.x+sx*DPR/SC,cam.y+sy*DPR/SC]}
cv.addEventListener('pointerdown',e=>{if(paused)return;ac();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(x){}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=S.zoom||0;mode='pinch';hl=null;return}
  start={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,t:performance.now()};moved=false;camT=null;
  const [wx,wy]=toWorld(e.clientX,e.clientY),tx=Math.floor(wx/T),ty=Math.floor(wy/T);
  const act=scene==='farm'?tileAction(tx,ty):null;
  if(act==='plant'||act==='harvest'){mode=act;lastTile=tx+','+ty;hl=[tx,ty];if(act==='plant')plant(tx,ty);else harvest(tx,ty)}
  else mode='pan'});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const z=Math.max(-2,Math.min(3,zoom0+Math.round(Math.log2(d/pinch0)*2)));if(z!==S.zoom)setZoom(z,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>8)moved=true;
  if(mode==='pan'){cam.x=start.cx-dx*DPR/SC;cam.y=start.cy-dy*DPR/SC;clampCam()}
  else if(mode==='plant'||mode==='harvest'){const [wx,wy]=toWorld(e.clientX,e.clientY),tx=Math.floor(wx/T),ty=Math.floor(wy/T),key=tx+','+ty;if(key!==lastTile){lastTile=key;hl=[tx,ty];const a2=tileAction(tx,ty);if(mode==='plant'&&a2==='plant')plant(tx,ty);else if(mode==='harvest'&&a2==='harvest')harvest(tx,ty)}}});
function endP(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(mode==='pan'&&!moved&&start&&performance.now()-start.t<400)tap(e.clientX,e.clientY);
  if(ptrs.size===0){if(mode==='plant'||mode==='harvest')save();mode=null;start=null;hl=null}}
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(Math.max(-2,Math.min(3,(S.zoom||0)+(e.deltaY<0?1:-1))),e.clientX,e.clientY)},{passive:false});
function setZoom(z,sx,sy){const [wx,wy]=toWorld(sx,sy);S.zoom=z;resize();cam.x=wx-sx*DPR/SC;cam.y=wy-sy*DPR/SC;clampCam()}
const inR=(x,y,rx,ry,rw,rh)=>x>=rx&&x<rx+rw&&y>=ry&&y<ry+rh;
function tap(sx,sy){const [wx,wy]=toWorld(sx,sy),tx=Math.floor(wx/T),ty=Math.floor(wy/T);if(scene==='town'){townTap(wx,wy);return}
  if(inR(wx,wy,36,30,80,84)){sfx('open');openMenu();return}
  if(inR(wx,wy,130,44,62,72)){sfx('open');openBarn();return}
  if(inR(wx,wy,572,70,90,60)){sfx('open');openMarket('sell');return}
  for(const c of customers)if(inR(wx,wy,c.x-6,c.y-26,12,28)){sfx('tap');toast(pick(['¡Qué rico se ve todo!','¿Tienes fresas?','¡Buenos días!','Me encanta tu puesto','Vengo cada semana']));return}
  for(const pd of PADS)if(inR(wx,wy,pd.x*T,pd.y*T-12,48,52)){sfx('open');if(S.mach[pd.k])openMach(pd.k);else{bTab='mach';openBuild('mach')}return}
  for(const bp of BPADS)if(inR(wx,wy,bp.x*T,bp.y*T-16,80,96)){sfx('open');if(S.mach[bp.k])openMach(bp.k);else openBizBuy(BIZ.findIndex(b=>b.k===bp.k));return}
  for(let i=0;i<SPOTS.length;i++){const s=SPOTS[i];if(inR(wx,wy,s[0]*T-4,s[1]*T-20,40,54)){treeTap(i);return}}
  const L=plotLot(tx,ty);if(L&&!S.lots.includes(L.i)){sfx('open');openLot(L.i);return}
  const p=S.plots[tx+','+ty];if(p){toast(CROPS[p.c].n+' · lista en '+secs(p.done));return}
  if(L){const err=canPlant(S.sel,tx,ty);if(err){toast(err);sfx('no')}}
}
addEventListener('resize',()=>{resize();renderSeeds()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else offline()});

/* ===================== OFFLINE ===================== */
function offline(){const el=Math.min(8*3600,(Date.now()-(S.last||Date.now()))/1000);if(el<60)return;
  const rate=(60/4.5)*(1+.4*(S.up.sign||0))*2/60;const mul=S.up.helper?.75:.25;let n=Math.floor(el*rate*mul),earn=0,sold=0;
  while(n>0){const ks=forSale();if(!ks.length)break;const k=pick(ks);S.inv[k]--;if(!S.inv[k])delete S.inv[k];earn+=val(k);sold++;n--}
  const bizEarn=0;
  S.coins+=earn+bizEarn;S.st.sold+=sold;S.st.earned+=earn+bizEarn;S.last=Date.now();
  const ready=Object.values(S.plots).filter(p=>Date.now()>=p.done).length;
  if(sold||ready||bizEarn){setTimeout(()=>modal('¡Bienvenido de vuelta!','',`<p class="t">Mientras no estabas${S.up.helper?', tu ayudante':''}:</p>${sold?`<div class="row"><div class="n">Vendió ${sold} productos</div><span class="price" style="font-size:20px">${COIN} ${earn}</span></div>`:''}${bizEarn?`<div class="row"><div class="n">Tus negocios ganaron</div><span class="price" style="font-size:20px">${COIN} ${fmt(bizEarn)}</span></div>`:''}${ready?`<div class="row"><div class="n">${ready} cultivos están listos para cosechar</div></div>`:''}<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn g" data-a="close">¡A trabajar!</button></div>`),400)}
  hudDirty=true;save()}

/* ===================== INTRO ===================== */
const sp=$('splash'),sg=sp.getContext('2d');let spT0=0,spDone=false,spReady=false;
function logoMark(c,cx,cy,s,gr,sc){c.save();c.translate(cx,cy);c.scale(sc,sc);c.translate(-cx,-cy);
  const g=c.createLinearGradient(cx-s/2,cy-s/2,cx+s/2,cy+s/2);g.addColorStop(0,'#3F6E54');g.addColorStop(1,'#203A2D');
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.roundRect(cx-s/2,cy-s/2+s*.05,s,s,s*.27);c.fill();c.fillStyle=g;c.beginPath();c.roundRect(cx-s/2,cy-s/2,s,s,s*.27);c.fill();
  c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.roundRect(cx-s/2+s*.04,cy-s/2+s*.04,s*.92,s*.42,s*.23);c.fill();
  c.fillStyle='#E7C9A0';c.beginPath();c.ellipse(cx,cy+s*.3,s*.3,s*.1,0,Math.PI,Math.PI*2);c.fill();c.fillStyle='#D3AE80';c.beginPath();c.ellipse(cx+s*.1,cy+s*.3,s*.16,s*.06,0,Math.PI,Math.PI*2);c.fill();
  if(gr>0){c.strokeStyle='#F6F3EC';c.lineWidth=s*.055;c.lineCap='round';c.beginPath();c.moveTo(cx,cy+s*.22);c.quadraticCurveTo(cx-s*.02,cy+s*.02,cx,cy+s*(.22-.34*gr));c.stroke();
    const ty=cy+s*(.22-.34*gr),lg=Math.max(0,(gr-.4)/.6);if(lg>0)[[-1,'#A8E07E'],[1,'#7FC86A']].forEach(([d,col])=>{c.save();c.translate(cx,ty+s*.04);c.rotate(d*.55*lg);c.scale(lg,lg);c.fillStyle=col;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(d*s*.08,-s*.17,d*s*.27,-s*.15);c.quadraticCurveTo(d*s*.2,s*.04,0,0);c.fill();c.restore()})}
  c.restore()}
function splash(now){if(spDone)return;if(!spT0)spT0=now;const t=(now-spT0)/1000;const W=sp.width=innerWidth*DPR,H=sp.height=innerHeight*DPR,u=Math.min(W,H)/900;
  const bg=sg.createRadialGradient(W/2,H*.42,50*u,W/2,H/2,Math.max(W,H)*.75);bg.addColorStop(0,'#F6F3EC');bg.addColorStop(1,'#D9E6CC');sg.fillStyle=bg;sg.fillRect(0,0,W,H);
  const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);const s=300*u,cx=W/2,cy=H*.4;const pop=t<.6?ease(t/.6)*1.08:t<.8?1.08-(t-.6)/.2*.08:1;
  if(t<.9){const st=Math.min(1,t/.7);sg.fillStyle='#8A6B4E';sg.beginPath();sg.ellipse(cx,Math.min(cy-s*.9+st*st*s*1.1,cy+s*.2),s*.03,s*.045,0,0,7);sg.fill()}
  logoMark(sg,cx,cy,s,ease((t-.7)/.9),Math.max(.01,pop));
  const txt='MyGarden';sg.font='700 '+(96*u)+'px Pix, monospace';const tw=sg.measureText(txt).width;let x=cx-tw/2;const ty=cy+s*.5+105*u;
  [...txt].forEach((l,i)=>{const lt=t-1.3-i*.07;if(lt<0)return;const a=ease(lt/.4);sg.fillStyle=i<2?'rgba(94,138,110,'+a+')':'rgba(36,56,44,'+a+')';sg.fillText(l,x,ty+(1-a)*30*u);x+=sg.measureText(l).width});
  if(t>2.1){const a=ease((t-2.1)/.5);sg.textAlign='center';sg.font='400 '+(26*u)+'px Pix, monospace';sg.fillStyle='rgba(124,146,132,'+a+')';sg.fillText('DE SEMILLA A IMPERIO',cx,ty+56*u);if(t>2.6){spReady=true;sg.font='400 '+(24*u)+'px Pix, monospace';sg.fillStyle='rgba(36,56,44,'+(.35+Math.sin(t*3)*.25)+')';sg.fillText(spAudio?'♪  Toca para jugar  ♪':'Toca para empezar',cx,H-60*u)}sg.textAlign='left'}
  requestAnimationFrame(splash)}
let spAudio=false;
sp.addEventListener('pointerdown',()=>{if(!spAudio){spAudio=true;ac();if(!spReady)spT0-=3000;return}if(!spReady){spT0-=3000;return}sfx('level');spDone=true;sp.style.transition='opacity .6s';sp.style.opacity='0';setTimeout(()=>sp.remove(),650);start2()});
function centerStart(){const pw=cv.width/SC,ph=cv.height/SC;cam.x=8*T-pw/2+40;cam.y=14*T-ph/2;clampCam()}
function start2(){setMusic(season());$('hud').hidden=false;paused=false;hudDirty=true;renderSeeds();
  if(!S.intro){S.intro=true;save();setTimeout(()=>modal('Tu primera semilla','',`<p class="t">Te dejaron un terreno con 24 parcelas, una casita y un pequeño puesto junto al camino.</p><p class="t">Elige una semilla abajo y toca la tierra para plantar. Cuando brille, cosecha. Tus clientes llegarán solos a comprar en el mercado.</p><p class="t">Gana dinero, compra terrenos, árboles y talleres… y convierte tu semilla en un imperio.</p><div style="display:flex;justify-content:flex-end"><button class="btn g" data-a="close">¡Plantar!</button></div>`),300)}
  else offline()}
/* ===================== BUCLE ===================== */
let last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);
  if(camT){cam.x+=(camT.x-cam.x)*.12;cam.y+=(camT.y-cam.y)*.12;clampCam();if(Math.abs(camT.x-cam.x)<.5&&Math.abs(camT.y-cam.y)<.5)camT=null}
  render();hudT+=dt;if(hudDirty||hudT>.5){hud();hudDirty=false;hudT=0}requestAnimationFrame(loop)}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').then(r=>{window.__swReg=r}).catch(()=>{})}
load();genMap();
const btns={orders:'orders',build:'build',menu:'menu'};Object.entries(btns).forEach(([a,n])=>{const b=document.querySelector('[data-a='+a+']');b.appendChild(icon(n,30))});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{resize();S.lastSeason=S.lastSeason||Math.floor(dayN()/SDAYS);buildWorld();if(S.cam){cam.x=S.cam.x;cam.y=S.cam.y;clampCam()}else centerStart();requestAnimationFrame(loop);requestAnimationFrame(splash)});
setInterval(()=>{S.cam={x:cam.x,y:cam.y}},3000);
window.__mg={S:()=>S,cam,tap,setTime:t=>{S.ptime=t},buildWorld,plantAt:(x,y)=>plant(x,y),harvestAt:harvest,update};
})();
</script>
